<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Calcule a bomba d'água certa para o seu sítio: altura manométrica, potência do motor e modelos compatíveis. Funciona sem internet." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="HidroCalc" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>HidroCalc: qual bomba eu preciso?</title>
    <script>
      // Aplica o tema guardado antes de desenhar a página (evita piscar).
      try {
        if (JSON.parse(localStorage.getItem('hidrocalc_tema')) === 'escuro') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
